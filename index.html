<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="Agenda online compartilhada para escritório jurídico.">
  <title>Nossa Agenda Online</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{--navy:#172554;--blue:#2563eb;--bg:#f4f6fb;--line:#e5e7eb;--muted:#64748b;--ink:#172033}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#101c45,#254b87)}
    .login-card{background:white;border-radius:24px;padding:36px;width:min(430px,100%);box-shadow:0 24px 70px #0003;text-align:center}
    .logo{width:58px;height:58px;border-radius:18px;background:#e8efff;color:var(--blue);display:grid;place-items:center;font-size:28px;margin:0 auto 18px}
    h1{font-size:25px;margin:0 0 8px}.sub{color:var(--muted);line-height:1.5}.google{margin-top:22px;width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:13px;font-weight:650}
    .hint{font-size:12px;color:var(--muted);margin-top:18px}
    .app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--navy);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:24px}
    .brand{font-size:18px;font-weight:750;padding:0 10px}.brand small{display:block;color:#b8c6e8;font-size:11px;font-weight:500;margin-top:4px}
    .nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#dbe5ff;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff1b;color:white}
    .userbox{margin-top:auto;border-top:1px solid #ffffff2b;padding:16px 8px 0;font-size:12px;color:#dbe5ff;overflow-wrap:anywhere}
    .userbox button{margin-top:12px;background:#ffffff18;color:white;border:0;border-radius:8px;padding:9px 12px}
    main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top h2{margin:0;font-size:26px}.top p{margin:5px 0 0;color:var(--muted)}
    .primary{background:var(--blue);color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:650}.secondary{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:26px;margin-top:8px}
    .panel h3{margin:0 0 14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:white;width:100%}
    .calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.dow{text-align:center;color:var(--muted);font-size:12px;padding:8px}
    .day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:95px;padding:8px;overflow:hidden}.day.muted{opacity:.45}.day.today{border:2px solid var(--blue)}.daynum{font-size:12px;font-weight:700}.event-chip{font-size:10px;background:#eaf0ff;color:#1d4ed8;padding:4px 5px;border-radius:5px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;background:white}.item small{color:var(--muted)}.empty{color:var(--muted);padding:20px;text-align:center}
    .modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:16px;z-index:10}.modal-card{background:white;border-radius:18px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head button{border:0;background:transparent;font-size:22px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:650}.field.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .notice{padding:12px;background:#fff7ed;color:#9a3412;border-radius:10px;font-size:13px;margin-bottom:16px}
    @media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.brand{padding:5px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px}.userbox{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}.userbox button{margin:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px}.day{min-height:75px;padding:5px}.event-chip{font-size:9px}}
    @media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:21px}.day{min-height:62px}.event-chip{display:none}.calendar{gap:3px}}
  </style>
</head>
<body>
  <section id="login" class="login-wrap">
    <div class="login-card">
      <div class="logo">▦</div>
      <h1>Nossa Agenda Online</h1>
      <p class="sub">Seu escritório organizado em um só lugar.<br>Entre com sua conta Google autorizada.</p>
      <button id="loginBtn" class="google">G 　Entrar com Google</button>
      <p id="loginError" class="hint"></p>
      <p class="hint">O acesso é restrito aos e-mails autorizados pelo administrador.</p>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">Nossa Agenda <small>GESTÃO DO ESCRITÓRIO</small></div>
      <nav class="nav" id="nav">
        <button class="active" data-view="inicio">▦ Visão geral</button>
        <button data-view="agenda">▣ Agenda</button>
        <button data-view="clientes">♙ Clientes</button>
        <button data-view="audiencias">⚖ Audiências</button>
        <button data-view="pagamentos">R$ Pagamentos</button>
        <button data-view="tarefas">☑ Tarefas</button>
        <button data-view="anotacoes">✎ Anotações</button>
      </nav>
      <div class="userbox"><span id="userEmail">Conectado</span><button id="logoutBtn">Sair</button></div>
    </aside>
    <main>
      <div class="top"><div><h2 id="pageTitle">Visão geral</h2><p id="pageSub">Acompanhe os compromissos do escritório.</p></div><button id="addBtn" class="primary">＋ Novo registro</button></div>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><h3 id="modalTitle">Novo registro</h3><button id="closeModal" aria-label="Fechar">×</button></div>
      <form id="recordForm">
        <div id="formFields" class="formgrid"></div>
        <div class="actions"><button type="button" id="cancelModal" class="secondary">Cancelar</button><button class="primary" type="submit">Salvar</button></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    // SUBSTITUA pelos dados do seu projeto Firebase (Console > Configurações > Seus apps > Web).
    const firebaseConfig = {
      apiKey: "AIzaSyAd1QZuyFPixDYw9Bd2CPLtJPlWbHnXX9w",
      authDomain: "nossa-agenda-6798a.firebaseapp.com",
      projectId: "nossa-agenda-6798a",
      storageBucket: "nossa-agenda-6798a.firebasestorage.app",
      messagingSenderId: "436772680405",
      appId: "1:436772680405:web:633e0bc36c4d628937a85c",
      measurementId: "G-STR0CSNVP8"
    };

    const loginEl = document.getElementById("login"), appEl = document.getElementById("app");
    const loginError = document.getElementById("loginError");
    let auth, db, currentUser, records = [], activeView = "inicio", month = new Date();
    const views = {
      inicio:["Visão geral","Resumo dos próximos compromissos."],
      agenda:["Agenda","Calendário compartilhado do escritório."],
      clientes:["Clientes","Cadastro e consulta de clientes."],
      audiencias:["Audiências","Controle de audiências e prazos."],
      pagamentos:["Pagamentos","Acompanhe valores e status."],
      tarefas:["Tarefas","Atividades que precisam de atenção."],
      anotacoes:["Anotações","Informações importantes do escritório."]
    };
    const fieldsByView = {
      agenda:[["title","Título","text",true],["date","Data","date",true],["time","Horário","time"],["category","Categoria","select",false,["Compromisso","Reunião","Retorno","Prazo"]],["client","Cliente","text"],["notes","Anotações","textarea"]],
      clientes:[["title","Nome do cliente","text",true],["phone","Telefone","tel"],["email","E-mail","email"],["document","CPF/CNPJ","text"],["notes","Observações","textarea"]],
      audiencias:[["title","Processo / audiência","text",true],["date","Data","date",true],["time","Horário","time"],["client","Cliente","text"],["location","Local / link","text"],["notes","Observações","textarea"]],
      pagamentos:[["title","Descrição","text",true],["date","Vencimento","date"],["value","Valor (R$)","number"],["status","Status","select",false,["Pendente","Pago","Atrasado"]],["client","Cliente","text"],["notes","Observações","textarea"]],
      tarefas:[["title","Tarefa","text",true],["date","Prazo","date"],["status","Status","select",false,["Pendente","Em andamento","Concluída"]],["notes","Detalhes","textarea"]],
      anotacoes:[["title","Título","text",true],["notes","Anotação","textarea",true]]
    };
    function initFirebase(){
      if(firebaseConfig.apiKey.startsWith("COLE_") || firebaseConfig.projectId==="SEU-PROJETO"){
        loginError.textContent="Configuração pendente: conecte o projeto Firebase para ativar o login e salvar os dados.";
        document.getElementById("loginBtn").disabled=true; return;
      }
      const fb=initializeApp(firebaseConfig); auth=getAuth(fb); db=getFirestore(fb);
      onAuthStateChanged(auth,user=>{
        if(user){currentUser=user;loginEl.classList.add("hidden");appEl.classList.remove("hidden");document.getElementById("userEmail").textContent=user.email||"Conectado";subscribe();}
        else{appEl.classList.add("hidden");loginEl.classList.remove("hidden");}
      });
    }
    document.getElementById("loginBtn").onclick=async()=>{
      try{await signInWithPopup(auth,new GoogleAuthProvider());}
      catch(e){loginError.textContent=e.code==="auth/unauthorized-domain"?"Domínio não autorizado no Firebase.":(e.message||"Não foi possível entrar.");}
    };
    document.getElementById("logoutBtn").onclick=()=>signOut(auth);
    function subscribe(){
      const q=query(collection(db,"agendaEvents"),orderBy("createdAt","desc"));
      onSnapshot(q,snap=>{records=snap.docs.map(d=>({id:d.id,...d.data()}));render();},e=>{document.getElementById("content").innerHTML=`<div class="notice">Não foi possível carregar os dados: ${escapeHtml(e.message)}</div>`;});
    }
    function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function dateText(v){if(!v)return "Sem data";const d=new Date(v+"T12:00:00");return d.toLocaleDateString("pt-BR");}
    function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
    function render(){
      const content=document.getElementById("content");
      const filtered=records.filter(r=>r.type===activeView || (activeView==="agenda" && ["agenda","audiencias"].includes(r.type)));
      if(activeView==="inicio"){
        const upcoming=records.filter(r=>r.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
        const pending=records.filter(r=>r.type==="pagamentos"&&r.status!=="Pago");
        content.innerHTML=`<div class="stats"><div class="stat"><span>Clientes cadastrados</span><strong>${records.filter(r=>r.type==="clientes").length}</strong></div><div class="stat"><span>Próximos compromissos</span><strong>${records.filter(r=>["agenda","audiencias"].includes(r.type)).length}</strong></div><div class="stat"><span>Pagamentos pendentes</span><strong>${pending.length}</strong></div><div class="stat"><span>Tarefas abertas</span><strong>${records.filter(r=>r.type==="tarefas"&&r.status!=="Concluída").length}</strong></div></div><section class="panel"><h3>Próximos registros</h3>${renderList(upcoming)}</section>`;
      } else if(activeView==="agenda"){
        content.innerHTML=`<section class="panel"><div class="calendar-head"><button class="secondary" id="prevMonth">‹</button><strong>${month.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</strong><button class="secondary" id="nextMonth">›</button></div><div id="calendar"></div></section><section class="panel" style="margin-top:16px"><h3>Compromissos e audiências</h3>${renderList(filtered.sort((a,b)=>(a.date||"").localeCompare(b.date||"")))}</section>`;
        drawCalendar();document.getElementById("prevMonth").onclick=()=>{month.setMonth(month.getMonth()-1);render()};document.getElementById("nextMonth").onclick=()=>{month.setMonth(month.getMonth()+1);render()};
      } else content.innerHTML=`<section class="panel"><div class="toolbar"><input id="filter" placeholder="Buscar neste painel..."></div><div id="recordList">${renderList(filtered)}</div></section>`;
      const filter=document.getElementById("filter");if(filter)filter.oninput=()=>{document.getElementById("recordList").innerHTML=renderList(filtered.filter(r=>(r.title||"").toLowerCase().includes(filter.value.toLowerCase())||(r.client||"").toLowerCase().includes(filter.value.toLowerCase())))};
    }
    function renderList(items){
      if(!items.length)return `<div class="empty">Nenhum registro por enquanto.</div>`;
      return `<div class="list">${items.map(r=>`<div class="item"><div><strong>${escapeHtml(r.title||"Sem título")}</strong><br><small>${dateText(r.date)} ${r.time? " • "+escapeHtml(r.time):""} ${r.client?" • "+escapeHtml(r.client):""} ${r.status?" • "+escapeHtml(r.status):""}</small>${r.value?`<br><small>${money(r.value)}</small>`:""}${r.notes?`<br><small>${escapeHtml(r.notes)}</small>`:""}</div><button class="secondary" data-delete="${r.id}" title="Excluir">Excluir</button></div>`).join("")}</div>`;
    }
    function drawCalendar(){
      const el=document.getElementById("calendar"),year=month.getFullYear(),m=month.getMonth(),first=new Date(year,m,1),start=(first.getDay()+6)%7,days=new Date(year,m+1,0).getDate(),prevDays=new Date(year,m,0).getDate();
      const names=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];let html=names.map(n=>`<div class="dow">${n}</div>`).join("");
      for(let i=0;i<42;i++){let n=i-start+1,cur=n>0&&n<=days,day=cur?n:n<=0?prevDays+n:n-days,dt=new Date(year,m+(n<=0?-1:n>days?1:0),day),key=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`,events=records.filter(r=>r.date===key&&["agenda","audiencias"].includes(r.type));html+=`<div class="day ${cur?"":"muted"} ${key===new Date().toISOString().slice(0,10)?"today":""}"><div class="daynum">${day}</div>${events.slice(0,2).map(e=>`<div class="event-chip">${escapeHtml(e.title)}</div>`).join("")}</div>`;}
      el.innerHTML=`<div class="calendar">${html}</div>`;
    }
    function openModal(){
      const type=activeView==="inicio"?"agenda":activeView, defs=fieldsByView[type]||fieldsByView.agenda;
      document.getElementById("modalTitle").textContent="Novo registro";
      document.getElementById("formFields").innerHTML=`<input type="hidden" name="type" value="${type}">`+defs.map(([name,label,kind,required,opts])=>`<div class="field ${kind==="textarea"?"full":""}"><label>${label}</label>${kind==="select"?`<select name="${name}">${opts.map(o=>`<option>${o}</option>`).join("")}</select>`:kind==="textarea"?`<textarea name="${name}" rows="3" ${required?"required":""}></textarea>`:`<input name="${name}" type="${kind}" ${required?"required":""} ${kind==="number"?'step="0.01" min="0"':""}>`}</div>`).join("");
      document.getElementById("modal").classList.remove("hidden");
    }
    function closeModal(){document.getElementById("modal").classList.add("hidden")}
    document.getElementById("addBtn").onclick=openModal;document.getElementById("closeModal").onclick=closeModal;document.getElementById("cancelModal").onclick=closeModal;
    document.getElementById("recordForm").onsubmit=async e=>{
      e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());data.type=data.type||activeView;data.createdBy=currentUser.email;data.createdAt=serverTimestamp();
      try{await addDoc(collection(db,"agendaEvents"),data);closeModal();e.target.reset();}
      catch(err){alert("Não foi possível salvar: "+err.message);}
    };
    document.getElementById("content").addEventListener("click",async e=>{const id=e.target.dataset.delete;if(id&&confirm("Excluir este registro?"))await deleteDoc(doc(db,"agendaEvents",id));});
    document.getElementById("nav").onclick=e=>{const b=e.target.closest("button[data-view]");if(!b)return;activeView=b.dataset.view;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("pageTitle").textContent=views[activeView][0];document.getElementById("pageSub").textContent=views[activeView][1];document.getElementById("addBtn").classList.toggle("hidden",activeView==="inicio"?false:false);render();};
    if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    initFirebase();
  </script>
</body>
</html>
